[package]
name = "videomind-desktop"
version = "0.1.0"
description = "VideoMind AI desktop shell"
edition = "2021"

[lib]
name = "videomind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
tar = "0.4"
flate2 = "1"

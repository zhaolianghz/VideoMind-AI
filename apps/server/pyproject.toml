[project]
name = "videomind"
version = "0.1.0"
description = "VideoMind AI - backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.5",
    "yt-dlp>=2024.8.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
llm = [
    "openai>=1.40",
    "anthropic>=0.34",
]
asr = [
    "faster-whisper>=1.0.3",
]
report = [
    "markdown>=3.7",
    "weasyprint>=60",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
videomind = "videomind.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videomind"]

[tool.ruff]
line-length = 100
target-version = "py311"
